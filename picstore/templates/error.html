{% extends "base.html" %}
{% block title %}{{ code }} — Фототека{% endblock %}

{% block content %}
<section class="panel panel--framed error-page">
  <p class="error-code mono">{{ code }}</p>
  <h1>{{ 'Картинка не найдена' if code == 404 else 'Что-то пошло не так' }}</h1>
  <p class="lede">{{ message or 'Запрос не может быть выполнен.' }}</p>
  <div class="toolbar">
    <a class="btn" href="{{ url_for('index') }}">К списку картинок</a>
  </div>
</section>
{% endblock %}
