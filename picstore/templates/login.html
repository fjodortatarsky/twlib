{% extends "base.html" %}
{% block title %}Вход — Фототека{% endblock %}

{% block content %}
<div class="auth-wrap">
  <section class="panel panel--framed">
    <h1>Вход</h1>
    <p class="lede">Загрузка и редактирование доступны авторизованным пользователям. Просмотр — всем.</p>

    {% if error %}
      <div class="error-box" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

      <div class="field">
        <label for="username">Имя</label>
        <input id="username" name="username" type="text" autocomplete="username"
               required autofocus>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button class="btn btn-block" type="submit">Войти</button>
    </form>

    <p class="hint">Сейчас работает локальная заглушка аутентификации.</p>
  </section>
</div>
{% endblock %}
